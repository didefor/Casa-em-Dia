<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f17">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Casa em Dia">
  <link rel="apple-touch-icon" href="img/app-180.png">
  <title>Casa em Dia</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="avatars" id="brandAvatars"></div>
        <div>
          <strong>Casa em Dia</strong>
          <small>Finanças em casal</small>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="theme-row">
          <span class="muted">Tema</span>
          <div class="seg" id="themeSeg">
            <button data-theme-set="light" title="Claro" aria-label="Tema claro"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
            <button data-theme-set="dark" title="Escuro" aria-label="Tema escuro"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
          </div>
        </div>
        <div class="profile" id="profile"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="month-nav">
          <button class="icon-btn ghost" id="prevMonth" aria-label="Mês anterior"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="icon-btn ghost" id="nextMonth" aria-label="Próximo mês"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <h1 id="monthTitle"></h1>
          <input type="month" id="monthPicker" class="month-picker" aria-label="Escolher mês">
        </div>
        <span class="greeting" id="greeting"></span>
        <button class="icon-btn" id="helpTopBtn" aria-label="Como usar" title="Como usar"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6"/><path d="M12 17.2v.1"/></svg></button>
        <div class="bell-wrap">
          <button class="icon-btn" id="bellBtn" aria-label="Notificações"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
          <div class="menu notif-panel" id="notifPanel"></div>
        </div>
        <div class="top-actions">
          <div class="dropdown">
            <button class="btn primary" id="addBtn">+ Adicionar</button>
            <div class="menu" id="addMenu"></div>
          </div>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
    <nav class="tab-bar" id="tabBar" aria-label="Navegação"></nav>
  </div>

  <dialog id="modal"><form id="modalForm" method="dialog"></form></dialog>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
